name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: src
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

  # ─── Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline (build canonical tables)
        run: python -m etl.pipeline

      - name: Run full test suite with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short \
            -q

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─── Financial invariants (separate job — must always pass) ───────────────
  invariants:
    name: Financial invariant checks
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        run: python -m etl.pipeline

      - name: Assert BS balances, CF reconciles, RE rolls (±$0.01M)
        run: pytest tests/test_financial_invariants.py -v --tb=long

  # ─── Docker build check ───────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nvidia-fpa-platform:${{ github.sha }} .

      - name: Smoke-test container startup
        run: |
          docker run -d --name fpa-test -p 8501:8501 nvidia-fpa-platform:${{ github.sha }}
          sleep 20
          curl --fail http://localhost:8501/_stcore/health || (docker logs fpa-test && exit 1)
          docker stop fpa-test
